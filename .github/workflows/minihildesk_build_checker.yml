name: minihildesk Build Checker (SIL)
on:
  push:
    branches: [ master ]
    paths:
      - 'sw/minihildesk/**/*.cc'
      - 'sw/minihildesk/**/*.h'
      - 'sw/minihildesk/CMakeLists.txt'
  pull_request:
    branches: [ master ]
    paths:
      - 'sw/minihildesk/**/*.cc'
      - 'sw/minihildesk/**/*.h'
      - 'sw/minihildesk/CMakeLists.txt'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            nlohmann-json3-dev \
            libgtkmm-4.0-dev \
            libssl-dev \
            libglib2.0-dev

      - name: Configure CMake
        run: |
          cmake -B sw/minihildesk/build -S sw/minihildesk

      - name: Build project
        run: |
          cmake --build sw/minihildesk/build --config Release
